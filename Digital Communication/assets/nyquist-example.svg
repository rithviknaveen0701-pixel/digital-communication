<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><style>text{font-family:Arial,sans-serif;font-size:20px}.a{stroke:black;stroke-width:2}.s{stroke:black;stroke-width:3}</style><text x="60" y="35">Nyquist-rate example from the handwritten notes</text><text x="60" y="80">For m(t) = A cos(2000πt) cos(1000πt):</text><text x="60" y="120">cos α cos β = ½[cos(α+β) + cos(α−β)]</text><text x="60" y="165">Highest frequency component = 1500 Hz</text><text x="60" y="205">Nyquist rate = 2fₘ = 3000 Hz</text><text x="60" y="245">Nyquist interval = 1/(2fₘ) = 1/3000 s</text><path class="a" d="M60 330H1030"/><path class="s" d="M260 330L360 220L460 330M610 330L710 220L810 330"/><text x="330" y="365">−fₘ</text><text x="700" y="365">fₘ</text></svg>